name: ci

on:
  push:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']
    tags: ['**']
  pull_request:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']

jobs:

  test:
    name: Erlang ${{ matrix.otp_version }} build
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        otp_version: [27, 28]

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: '3.25'
    - name: Check rebar3 Version
      run: rebar3 --version
    - name: Compile
      run: rebar3 compile
    - name: Check Formatting
      run: rebar3 fmt --check
    - name: Lint
      run: rebar3 lint
    - name: Xref Checks
      run: rebar3 xref

    - name: EUnit Tests
      run: rebar3 eunit --cover
    - name: Common Test
      run: rebar3 ct --cover
    - name: PropEr Tests
      run: rebar3 proper -c
    - name: Dialyzer
      run: rebar3 dialyzer
    - name: Test Coverage
      run: |
        rebar3 cover
        escript scripts/check_coverage.escript

  example:
    name: erlang-concepts example (OTP ${{ matrix.otp_version }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        otp_version: [27, 28]
    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: '3.25'
    - name: Fetch concept-cards corpus
      run: make -C examples/erlang-concepts fetch-cards
    - name: Example tests (oracle parity gate)
      run: cd examples/erlang-concepts && rebar3 eunit --module=erlc_parser_tests,erlc_ingest_tests,erlc_queries_tests,erlc_oracle_tests
    - name: Example end-to-end smoke
      run: make -C examples/erlang-concepts example
